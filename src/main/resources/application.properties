spring.application.name=Operational Close Validator

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
ocv.business.time-zone=${OCV_BUSINESS_TIME_ZONE:UTC}
spring.jpa.open-in-view=false

ocv.persistence.pessimistic-lock-timeout-ms=${OCV_PESSIMISTIC_LOCK_TIMEOUT_MS:5000}

ocv.login.max-failures=${OCV_LOGIN_MAX_FAILURES:10}
ocv.login.window-seconds=${OCV_LOGIN_WINDOW_SECONDS:300}
ocv.login.block-seconds=${OCV_LOGIN_BLOCK_SECONDS:300}

server.servlet.session.timeout=${OCV_SESSION_EXPIRY_MINUTES:30}m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

spring.servlet.multipart.max-file-size=${OCV_EVIDENCE_MAX_FILE_SIZE_BYTES:10485760}B
spring.servlet.multipart.max-request-size=${OCV_EVIDENCE_MAX_REQUEST_SIZE_BYTES:12582912}B
ocv.evidence.storage.maximum-content-bytes=${OCV_EVIDENCE_MAX_FILE_SIZE_BYTES:10485760}

logging.structured.format.console=ecs
logging.structured.ecs.service.environment=${OCV_ENVIRONMENT:local}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,evidenceStorage
management.endpoint.health.group.startup.include=readinessState,db,evidenceStorage

spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-path=never
spring.web.error.whitelabel.enabled=false
spring.mvc.log-request-details=false
spring.mvc.log-resolved-exception=false