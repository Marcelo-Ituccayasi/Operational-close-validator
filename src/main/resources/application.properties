spring.application.name=Operational Close Validator

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jpa.open-in-view=false

ocv.persistence.pessimistic-lock-timeout-ms=${OCV_PESSIMISTIC_LOCK_TIMEOUT_MS:5000}

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
ocv.evidence.storage.maximum-content-bytes=${OCV_EVIDENCE_STORAGE_MAXIMUM_CONTENT_BYTES:10485760}

logging.structured.format.console=ecs
logging.structured.ecs.service.environment=${OCV_ENVIRONMENT:local}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,evidenceStorage
management.endpoint.health.group.startup.include=readinessState,db,evidenceStorage
