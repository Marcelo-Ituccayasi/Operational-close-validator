name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Verify project
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if bash mvnw -B verify 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi
            if ! grep -q "status code: 429" "$log_file"; then
              rm -f "$log_file"
              exit 1
            fi
            rm -f "$log_file"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Build OCI image
        run: docker build --pull --build-arg APP_VERSION=0.0.1-SNAPSHOT --build-arg VCS_REF=${{ github.sha }} --tag ocv:ci-${{ github.sha }} .

      - name: Validate OCI image
        shell: bash
        run: |
          image="ocv:ci-${{ github.sha }}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "0.0.1-SNAPSHOT"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${{ github.sha }}"
          docker run --rm --entrypoint sh "$image" -c 'id -u | grep -qx 10001 && test -r /opt/ocv/app.jar && test ! -e /workspace && test ! -e /opt/ocv/.git'
